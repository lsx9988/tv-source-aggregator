name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["tv-app/**", ".github/workflows/android-build.yml"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools;build-tools;34.0.0;platforms;android-34
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: tv-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-app-debug-apk
          path: tv-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TV App debug build #${{ github.run_number }}
          files: tv-app/app/build/outputs/apk/debug/app-debug.apk
